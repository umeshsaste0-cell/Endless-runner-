    <!-- Google AdSense / H5 Games Ads Integration -->
    <script>
      (function() {
        var defaultPubId = 'ca-pub-1897225080989873';
        var savedPubId = '';
        try { savedPubId = localStorage.getItem('google_ads_pub_id'); } catch(e) {}
        var activePubId = (savedPubId && savedPubId.trim()) ? savedPubId.trim() : defaultPubId;
        if (activePubId && !activePubId.startsWith('ca-pub-') && activePubId.startsWith('pub-')) {
          activePubId = 'ca-' + activePubId;
        }
        var s = document.createElement('script');
        s.id = 'google-adsense-script';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-ad-client', activePubId);
        s.setAttribute('data-ad-frequency-hint', '30s');
        s.setAttribute('data-adbreak-test', 'on');
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + activePubId;
        document.head.appendChild(s);
      })();
    </script>
    <script>
      window.adsbygoogle = window.adsbygoogle || [];
      window.adBreak = window.adBreak || function(o) { (adsbygoogle.push(o)); };
      window.adConfig = window.adConfig || function(o) { (adsbygoogle.push(o)); };
      
      // Configure H5 games ad settings
      adConfig({
        preloadAdBreaks: 'on',
        sound: 'on'
      });
    </script>
